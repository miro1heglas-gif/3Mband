<!DOCTYPE html>
<html lang="sk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>3Mband</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:17px -apple-system,system-ui,sans-serif;color:#fff;touch-action:manipulation}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#track{display:flex;height:100%;transition:transform .35s ease;will-change:transform}
.slot{flex:0 0 100vw;width:100vw;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#fff}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#ccc}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 6px);left:6px;z-index:5;width:34px;height:34px;border-radius:17px;background:rgba(17,24,39,.35);color:rgba(255,255,255,.7);text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:20px}
#pg{position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom) + 4px);z-index:5;font-size:12px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);padding:2px 8px;border-radius:10px;pointer-events:none}
.zone{position:fixed;top:48px;bottom:0;z-index:2}
#zp{left:0;width:30%}#zn{right:0;width:70%}
</style></head><body>
<div id="stage"><div id="track"></div></div>
<div id="msg">Načítavam…</div>
<a class="back" href="./" aria-label="Späť">‹</a><div id="pg"></div>
<div class="zone" id="zp"></div><div class="zone" id="zn"></div>
<script>
const p=new URLSearchParams(location.search),f=p.get('f'),t=p.get('t')||'';
document.title=t||'3Mband';
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const $=id=>document.getElementById(id);
let pdf,n=1;
function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})}
function showBar(){}
let cache=new Map(),size='',slots=[];
async function render(k){
  const W=window.innerWidth,H=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,3);
  const key=W+'x'+H;if(key!==size){cache=new Map();size=key;slots.forEach(x=>x.innerHTML='')}
  if(cache.has(k))return cache.get(k);
  const job=(async()=>{
    const pg=await pdf.getPage(k),v0=pg.getViewport({scale:1});
    const s=Math.min(W/v0.width,H/v0.height),v=pg.getViewport({scale:s*dpr});
    const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    c.style.width=Math.floor(v0.width*s)+'px';c.style.height=Math.floor(v0.height*s)+'px';
    return c;
  })();
  cache.set(k,job);return job;
}
async function fill(k){
  if(k<1||k>pdf.numPages)return;
  const c=await render(k),slot=slots[k-1];
  if(!slot.firstChild)slot.appendChild(c);
}
function pos(anim){
  const tr=$('track');tr.style.transition=anim?'':'none';
  tr.style.transform='translateX('+(-(n-1)*window.innerWidth)+'px)';
  $('pg').textContent=n+' / '+pdf.numPages;
}
async function draw(){
  if(!pdf)return;
  pos(false);
  await fill(n);await fill(n+1);await fill(n-1);await fill(n+2);
}
function go(d){if(!pdf)return;const m=Math.min(pdf.numPages,Math.max(1,n+d));if(m!==n){n=m;pos(true);fill(n);fill(n+1);fill(n-1);fill(n+2)}showBar()}
$('zn').addEventListener('click',()=>{if(Date.now()-suppress>400)go(1)});
$('zp').addEventListener('click',()=>{if(Date.now()-suppress>400)go(-1)});
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext'].includes(k)){e.preventDefault();go(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious'].includes(k)){e.preventDefault();go(-1)}
  else if(k==='Home'){e.preventDefault();n=1;draw()}
  else if(k==='End'){e.preventDefault();n=pdf.numPages;draw()}
  else if(k==='Escape'){location.href='./'}
});
let sx=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){go(dx<0?1:-1);suppress=Date.now()}},{passive:true});
let suppress=0;
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150)});
(async()=>{
 try{
  let base='lib/';
  try{await load(base+'pdf.min.js');await fetch(base+'pdf.worker.min.js').then(r=>{if(!r.ok)throw 0})}catch(e){base=CDN;await load(CDN+'pdf.min.js')}
  pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const cands=[f,f.replace(/^pdf\//,''),'pdf/'+f.replace(/^pdf\//,'')].filter((x,i,a)=>a.indexOf(x)===i);
  for(const c of cands){try{pdf=await pdfjsLib.getDocument(encodeURI(c)).promise;break}catch(e){}}
  if(!pdf)throw new Error('PDF sa nenašlo ('+cands.join(', ')+')');
  $('msg').remove();
  const tr=$('track');for(let i=0;i<pdf.numPages;i++){const d=document.createElement('div');d.className='slot';tr.appendChild(d);slots.push(d)}
  await draw();showBar();
 }catch(e){$('msg').textContent='Nepodarilo sa načítať PDF: '+(e&&e.message||e)}
})();
</script></body></html>
