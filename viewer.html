<!DOCTYPE html>
<html lang="sk"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>3Mband</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:17px -apple-system,system-ui,sans-serif;color:#fff;touch-action:manipulation}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
canvas{display:block;background:#fff}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;color:#ccc}
.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;background:rgba(17,24,39,.92);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;transition:opacity .3s}
.bar.hide{opacity:0;pointer-events:none}
.bar a{color:#fff;text-decoration:none;background:#d62839;padding:8px 14px;border-radius:10px;font-weight:600;white-space:nowrap}
.bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar b{font-weight:600;color:#ccc;white-space:nowrap}
.zone{position:fixed;top:60px;bottom:0;z-index:2}
#zp{left:0;width:30%}#zn{right:0;width:70%}
</style></head><body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="msg">Načítavam…</div>
<div class="bar" id="bar"><a href="./">← Späť</a><span id="t"></span><b id="pg"></b></div>
<div class="zone" id="zp"></div><div class="zone" id="zn"></div>
<script>
const p=new URLSearchParams(location.search),f=p.get('f'),t=p.get('t')||'';
document.getElementById('t').textContent=t;document.title=t||'3Mband';
const CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const $=id=>document.getElementById(id),cv=$('c'),bar=$('bar');
let pdf,n=1,busy=false,again=false,timer;
function load(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('load '+src));document.head.appendChild(s)})}
function showBar(){bar.classList.remove('hide');clearTimeout(timer);timer=setTimeout(()=>bar.classList.add('hide'),3000)}
let cache=new Map(),size='';
async function render(k){
  const W=window.innerWidth,H=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,3);
  const key=W+'x'+H;if(key!==size){cache=new Map();size=key}
  if(cache.has(k))return cache.get(k);
  const job=(async()=>{
    const pg=await pdf.getPage(k),v0=pg.getViewport({scale:1});
    const s=Math.min(W/v0.width,H/v0.height),v=pg.getViewport({scale:s*dpr});
    const c=document.createElement('canvas');c.width=Math.floor(v.width);c.height=Math.floor(v.height);
    await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
    return {c,w:Math.floor(v0.width*s),h:Math.floor(v0.height*s)};
  })();
  cache.set(k,job);return job;
}
async function draw(){
  if(!pdf)return;
  if(busy){again=true;return}
  busy=true;
  do{again=false;
    const r=await render(n);
    cv.width=r.c.width;cv.height=r.c.height;cv.getContext('2d').drawImage(r.c,0,0);
    cv.style.width=r.w+'px';cv.style.height=r.h+'px';
    $('pg').textContent=n+' / '+pdf.numPages;
  }while(again);
  busy=false;
  if(n<pdf.numPages)render(n+1);
  if(n>1)render(n-1);
}
function go(d){if(!pdf)return;const m=Math.min(pdf.numPages,Math.max(1,n+d));if(m!==n){n=m;draw()}showBar()}
$('zn').addEventListener('click',()=>go(1));
$('zp').addEventListener('click',()=>go(-1));
document.addEventListener('touchstart',e=>{if(e.touches[0].clientY<60)showBar()},{passive:true});
document.addEventListener('mousemove',e=>{if(e.clientY<60)showBar()});
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter','MediaTrackNext'].includes(k)){e.preventDefault();go(1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace','MediaTrackPrevious'].includes(k)){e.preventDefault();go(-1)}
  else if(k==='Home'){e.preventDefault();n=1;draw()}
  else if(k==='End'){e.preventDefault();n=pdf.numPages;draw()}
  else if(k==='Escape'){location.href='./'}
});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150)});
(async()=>{
 try{
  let base='lib/';
  try{await load(base+'pdf.min.js');await fetch(base+'pdf.worker.min.js').then(r=>{if(!r.ok)throw 0})}catch(e){base=CDN;await load(CDN+'pdf.min.js')}
  pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const cands=[f,f.replace(/^pdf\//,''),'pdf/'+f.replace(/^pdf\//,'')].filter((x,i,a)=>a.indexOf(x)===i);
  for(const c of cands){try{pdf=await pdfjsLib.getDocument(encodeURI(c)).promise;break}catch(e){}}
  if(!pdf)throw new Error('PDF sa nenašlo ('+cands.join(', ')+')');
  $('msg').remove();
  await draw();showBar();
 }catch(e){$('msg').textContent='Nepodarilo sa načítať PDF: '+(e&&e.message||e)}
})();
</script></body></html>
