<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3Mband">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#111827">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>3Mband</title>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--tx:#fff;--mut:#8a8a8e;--acc:#ff5a6a;--ref:#ffa63d;--sep:#2c2c2e}
.bg{opacity:.2!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:transparent;color:var(--tx);font:17px -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#000;clip-path:inset(0);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px;border-bottom:0}

#az{display:flex;flex-wrap:wrap;gap:6px}
#az button{flex:0 0 auto;min-width:62px;height:62px;padding:0 10px;border:0;border-radius:12px;background:#1f2937;color:#ff5a6a;font:700 34px -apple-system,system-ui,sans-serif}
#az button:active{background:#d62839;color:#fff}
body{position:relative}
.bg{position:fixed;inset:0;z-index:-1;background:url(logo.png) center/contain no-repeat;opacity:.25}
html{background:var(--bg)}
header::before{content:'';position:fixed;inset:0;z-index:-1;background:url(logo.png) center/contain no-repeat;opacity:.2;pointer-events:none}
main{padding:4px 16px calc(env(safe-area-inset-bottom) + 24px)}
ul{list-style:none;margin:0;padding:0;background:color-mix(in srgb,var(--card) 82%,transparent);border-radius:12px;overflow:hidden}
.letter{color:var(--acc);font-size:28px;font-weight:700;margin:20px 6px 8px}
li a{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:24px 20px;color:inherit;text-decoration:none;border-bottom:1px solid var(--sep);font-size:34px}
li:last-child a{border-bottom:0}
li a:active{background:var(--sep)}
.r{display:flex;align-items:baseline;gap:18px;white-space:nowrap}
.pgs{color:var(--mut);font-size:22px}
.ref{color:var(--ref);font-weight:800;font-size:34px;white-space:nowrap;min-width:110px;text-align:right}
</style>
</head>
<body>
<div class="bg"></div><header><div id="az"></div></header>
<main id="list"></main>
<script>
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const list=document.getElementById('list'),az=document.getElementById('az'),hdr=document.querySelector('header');
try{history.scrollRestoration='manual'}catch(e){}
function split(t){const m=t.match(/^(.*?)[_ ]*(\d{1,2}-\d{1,3})$/);return m&&m[1]?{name:m[1].replace(/_/g,' ').trim(),ref:m[2]}:{name:t.replace(/_/g,' '),ref:''}}
function jump(id){
  const el=document.getElementById(id);if(!el)return false;
  window.scrollTo(0,el.getBoundingClientRect().top+scrollY-hdr.offsetHeight-8);return true;
}
fetch('songs.json').then(r=>r.json()).then(d=>{
  d.sort((a,b)=>a.title.localeCompare(b.title,'cs'));
  let h='',cur='',open=false,letters=[];
  d.forEach((s,i)=>{
    const c=norm(s.title)[0]||'#',L=/[A-Z]/.test(c)?c:'#';
    if(L!==cur){if(open)h+='</ul>';cur=L;letters.push(L);h+=`<div class="letter" id="L${L==='#'?'N':L}">${L}</div><ul>`;open=true}
    const p=split(s.title);
    h+=`<li><a id="s${i}" data-f="${s.file}" href="citanie.html?f=${encodeURIComponent(s.file)}&t=${encodeURIComponent(s.title)}"><span>${esc(p.name)}</span><span class="r"><span class="pgs">${s.pages?s.pages+' str.':''}</span><span class="ref">${p.ref}</span></span></a></li>`;
  });
  list.innerHTML=h+'</ul>';
  az.innerHTML=letters.map(L=>`<button data-l="L${L==='#'?'N':L}">${L}</button>`).join('');
  az.addEventListener('click',e=>{const b=e.target.closest('button');if(b)jump(b.dataset.l)});
  const last=localStorage.getItem('last3');
  if(last){const a=[...document.querySelectorAll('li a')].find(x=>x.dataset.f===last);
    if(a){const go=()=>{const r=a.getBoundingClientRect();window.scrollTo(0,r.top+scrollY-innerHeight/2+r.height/2)};go();requestAnimationFrame(go);setTimeout(go,150)}}
  document.addEventListener('click',e=>{const a=e.target.closest('li a');if(a)try{localStorage.setItem('last3',a.dataset.f)}catch(_){}},true);
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
